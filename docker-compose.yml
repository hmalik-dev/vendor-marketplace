# Local development runs against THIS Postgres service, not a Neon branch — see
# the README. Point DATABASE_URL at it and leave DATABASE_URL_UNPOOLED unset;
# `migration-url.ts` then falls back to the pooled URL, which is correct here
# because there is no PgBouncer in front of it.
#
# Why local rather than Neon: `pnpm dev` holds a connection pool open, so a Neon
# compute never scales to zero and a day of development burns CU-hours against a
# per-project monthly cap. Exhausting it suspends the compute — see ticket #200.
# Neon branches are still where staging and production live.
#
# The major version below must track the version Neon runs; a drift test in
# `packages/preflight` fails if it does not. MinIO is used on every run and
# stands in for Cloudflare R2.
services:
  postgres:
    image: postgres:18-alpine
    container_name: vendor-marketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vendor_marketplace
      POSTGRES_PASSWORD: vendor_marketplace_dev
      POSTGRES_DB: vendor_marketplace
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18+ images store data in a major-version subdirectory and
      # require the mount one level up; /var/lib/postgresql/data now aborts
      # startup. See docker-library/postgres#1259.
      - vendor-marketplace-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vendor_marketplace -d vendor_marketplace']
      interval: 5s
      timeout: 5s
      retries: 10

  # Cloudflare R2 speaks the S3 API, so local development points the same
  # client at MinIO. Nothing in `apps/api` knows the difference — only the
  # `S3_*` variables change between here and production.
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: vendor-marketplace-storage
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: vendor-marketplace
      MINIO_ROOT_PASSWORD: vendor_marketplace_dev
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - vendor-marketplace-storage:/data
    healthcheck:
      test: ['CMD-SHELL', 'mc ready local']
      interval: 5s
      timeout: 5s
      retries: 10

  # Creates the uploads bucket and makes object reads public, matching how the
  # production R2 bucket is served through its public domain.
  storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: vendor-marketplace-storage-init
    depends_on:
      storage:
        condition: service_healthy
    #
    # `set-json` with an object-read-only statement, NOT `mc anonymous set
    # download`. That canned policy grants `s3:ListBucket` on the bucket ARN as
    # well as `s3:GetObject` on its contents, so anyone could enumerate every
    # key in the bucket — every portfolio photo, profile picture and cover, for
    # every user.
    #
    # Both the key builder and the portfolio delete path lean on keys being
    # random UUIDs and therefore unguessable. Open listing makes that property
    # worthless: you do not have to guess a key you can read off a list.
    #
    # There is no `mc anonymous set` verb for object-read-without-list, which is
    # why this is a written policy rather than a shorter word.
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://storage:9000 vendor-marketplace vendor_marketplace_dev &&
      mc mb --ignore-existing local/vendor-marketplace-uploads &&
      echo '{\"Version\":\"2012-10-17\",\"Statement\":[{\"Effect\":\"Allow\",\"Principal\":{\"AWS\":[\"*\"]},\"Action\":[\"s3:GetObject\"],\"Resource\":[\"arn:aws:s3:::vendor-marketplace-uploads/*\"]}]}' > /tmp/uploads-policy.json &&
      mc anonymous set-json /tmp/uploads-policy.json local/vendor-marketplace-uploads
      "

volumes:
  vendor-marketplace-pgdata:
  vendor-marketplace-storage:
