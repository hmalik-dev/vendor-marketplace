# Local development runs against THIS Postgres service, not a Neon branch — see
# docs/development.md. Point DATABASE_URL at it and leave DATABASE_URL_UNPOOLED unset;
# `migration-url.ts` then falls back to the pooled URL, which is correct here
# because there is no PgBouncer in front of it.
#
# Why local rather than Neon: `pnpm dev` holds a connection pool open, so a Neon
# compute never scales to zero and a day of development burns CU-hours against a
# per-project monthly cap. Exhausting it suspends the compute — see ticket #200.
# Neon branches are still where staging and production live.
#
# The major version below must track the version Neon runs; a drift test in
# `packages/preflight` fails if it does not. Uploads are not served from here:
# Neon Object Storage has no local emulator, so `pnpm lane:up` creates a
# storage-only Neon branch (`lane-<id>`) and writes its STORAGE_* values into the
# lane env file. See docs/development.md.
services:
  postgres:
    image: postgres:18-alpine
    container_name: vendor-marketplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vendor_marketplace
      POSTGRES_PASSWORD: vendor_marketplace_dev
      POSTGRES_DB: vendor_marketplace
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18+ images store data in a major-version subdirectory and
      # require the mount one level up; /var/lib/postgresql/data now aborts
      # startup. See docker-library/postgres#1259.
      - vendor-marketplace-pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vendor_marketplace -d vendor_marketplace']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vendor-marketplace-pgdata:
