document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

transform:uppercase;color:#4A443C;background:#DFDACF;border-radius:4px;padding:4px 8px;display:inline-block;margin-bottom:8px}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"padding:44px 48px 30px\">\n<div style=\"display:flex;align-items:center;gap:12px;margin-bottom:14px\"><div style=\"position:relative;width:29px;height:20px\"><div style=\"position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;background:#B4552F\"><\u002Fdiv><div style=\"position:absolute;left:9px;top:0;width:20px;height:20px;border-radius:50%;border:1.5px solid #23201C\"><\u002Fdiv><\u002Fdiv><span style=\"font-family:'Instrument Serif',serif;font-size:32px;color:#23201C\">Orla<\u002Fspan><span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#6B6459;margin-left:8px\">Legal &amp; money surfaces · frames 31–33<\u002Fspan><\u002Fdiv>\n<div style=\"max-width:860px;font:400 13.5px/1.7 'Instrument Sans',sans-serif;color:#4A443C;margin-bottom:14px\">Extracted from <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">Orla — Screens<\u002Fspan> so it can travel on its own. Three surfaces, in the order they block a launch: the <strong style=\"font-weight:600\">reading layout<\u002Fstrong> behind <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">/terms<\u002Fspan>, <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">/privacy<\u002Fspan> and <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">/cookies<\u002Fspan>; the <strong style=\"font-weight:600\">vendor agreement<\u002Fstrong>, which is a flow step with a record rather than a page; and the <strong style=\"font-weight:600\">refund schedule<\u002Fstrong>, which is a block inside checkout and not a page at all. Frame numbers are kept from the parent document so references still resolve.<\u002Fdiv>\n<div style=\"max-width:860px;font:400 13.5px/1.7 'Instrument Sans',sans-serif;color:#4A443C;margin-bottom:16px\">Two of these gate money: Stripe Connect onboarding asks for the Terms and Privacy URLs before a vendor can be paid, and a vendor cannot be paid at all until they have accepted the agreement. System rules held throughout: clay <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">#B4552F<\u002Fspan> is a fill only and clay-as-text is <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">#A34A28<\u002Fspan>; muted labels are <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px\">#6B6459<\u002Fspan>; sage means settled. Prose is the one place the type scale changes — 15px/1.85 on a 660px measure, against the app’s 13.5px/1.6.<\u002Fdiv>\n<div style=\"max-width:860px;font:400 13px/1.7 'Instrument Sans',sans-serif;color:#4A443C;background:#F1ECE4;border-radius:12px;padding:14px 16px\"><strong style=\"font-weight:600\">Three numbers on these frames are mine, not the plan’s,<\u002Fstrong> and each is flagged on its own frame: the <strong style=\"font-weight:600\">event + 2 business days<\u002Fstrong> payout interval, the <strong style=\"font-weight:600\">30 days / 50% / non-refundable<\u002Fstrong> refund schedule, and cancellation enforcement (“repeated cancellations can end your listing”). The 12% commission is from the brief and is drawn as fact. Legal copy is written to the right length and register, and every factual claim matches the real stack — but it is not reviewed legal copy.<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"sc\">\n<div class=\"sc-h\"><span class=\"sc-n\">31<\u002Fspan><span class=\"sc-t\">Legal pages — /terms, /privacy, /cookies<\u002Fspan><span class=\"sc-mvp\">MVP<\u002Fspan><span class=\"sc-d\">One reading layout, three bodies. Nothing else in Orla is a wall of prose, so this is a shell the product doesn’t have yet: a <strong style=\"font-weight:600;color:#4A443C\">660px measure<\u002Fstrong>, prose set at 15px/1.85 rather than the 13.5px app size, a sticky jump rail, and a last-updated line directly under the title. Stripe Connect onboarding asks for the <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px\">/terms<\u002Fspan> and <span style=\"font-family:'JetBrains Mono',monospace;font-size:11.5px\">/privacy<\u002Fspan> URLs, so both must resolve before a vendor can be paid. Reached from the footer on every page — which means the footer needs a legal row it currently doesn’t have.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap\">\n\n<div style=\"flex:none\">\n<div class=\"bp\">1440 · /terms · signed out<\u002Fdiv>\n<div class=\"fr\" style=\"height:900px\" data-screen-label=\"31 Terms of Service\">\n<div class=\"hd\" style=\"padding:0 40px\">\n<div style=\"display:flex;align-items:center;gap:34px\">\n<div style=\"display:flex;align-items:center;gap:9px\"><div style=\"position:relative;width:22px;height:15px\"><div style=\"position:absolute;left:0;top:0;width:15px;height:15px;border-radius:50%;background:#B4552F\"><\u002Fdiv><div style=\"position:absolute;left:7px;top:0;width:15px;height:15px;border-radius:50%;border:1.2px solid #23201C\"><\u002Fdiv><\u002Fdiv><span style=\"font-family:'Instrument Serif',serif;font-size:19px;color:#23201C\">Orla<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:22px;font-size:13px;font-weight:500;color:#4A443C\"><span>Browse<\u002Fspan><span>How it works<\u002Fspan><span>For vendors<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:16px\"><span style=\"font-size:13px;font-weight:500;color:#4A443C\">Sign in<\u002Fspan><span style=\"font-size:12.5px;font-weight:600;color:#FFFDF9;background:#B4552F;padding:9px 17px;border-radius:999px\">Sign up<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:1;overflow:hidden;display:flex;justify-content:center;gap:56px;padding:52px 40px 0\">\n\n<div style=\"width:212px;flex:none;padding-top:96px\">\n<div class=\"lbl\" style=\"margin-bottom:13px\">On this page<\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:0;border-left:1px solid #E4DDD1\">\n<span style=\"font-size:12.5px;font-weight:600;color:#A34A28;padding:7px 0 7px 14px;box-shadow:inset 2px 0 0 #B4552F\">1 &nbsp;Who we are<\u002Fspan>\n<span style=\"font-size:12.5px;color:#4A443C;padding:7px 0 7px 14px\">2 &nbsp;What Orla does<\u002Fspan>\n<span style=\"font-size:12.5px;color:#4A443C;padding:7px 0 7px 14px\">3 &nbsp;Your account<\u002Fspan>\n<span style=\"font-size:12.5px;color:#4A443C;padding:7px 0 7px 14px\">4 &nbsp;Bookings and payment<\u002Fspan>\n<span style=\"font-size:12.5px;color:#4A443C;padding:7px 0 7px 14px\">5 &nbsp;Cancellations and refunds<\u002Fspan>\n<span style=\"font-size:12.5px;color:#4A443C;padding:7px 0 7px 14px\">6 &nbsp;If you are a vendor<\u002Fspan>\n<span style=\"font-size:12.5px;color:#4A443C;padding:7px 0 7px 14px\">7 &nbsp;Reviews<\u002Fspan>\n<span style=\"font-size:12.5px;color:#4A443C;padding:7px 0 7px 14px\">8 &nbsp;Files you upload<\u002Fspan>\n<span style=\"font-size:12.5px;color:#4A443C;padding:7px 0 7px 14px\">9 &nbsp;Liability<\u002Fspan>\n<span style=\"font-size:12.5px;color:#4A443C;padding:7px 0 7px 14px\">10 &nbsp;Changes to these terms<\u002Fspan>\n<span style=\"font-size:12.5px;color:#4A443C;padding:7px 0 7px 14px\">11 &nbsp;Contact<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"width:660px;flex:none\">\n<div class=\"lbl\" style=\"margin-bottom:11px\">Legal<\u002Fdiv>\n<div style=\"font-family:'Instrument Serif',serif;font-size:44px;line-height:1.06;color:#23201C;letter-spacing:-.015em;margin-bottom:13px\">Terms of Service<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:12px;padding-bottom:26px;border-bottom:1px solid #E4DDD1;margin-bottom:34px\">\n<span style=\"font:400 12.5px 'Instrument Sans',sans-serif;color:#6B6459\">Last updated <strong style=\"font-weight:600;color:#4A443C\">4 June 2026<\u002Fstrong><\u002Fspan>\n<span style=\"color:#C9C1B5\">·<\u002Fspan>\n<span style=\"font:400 12.5px 'Instrument Sans',sans-serif;color:#6B6459\">Effective for bookings made on or after that date<\u002Fspan>\n<\u002Fdiv>\n\n<div style=\"font-family:'Instrument Serif',serif;font-size:24px;color:#23201C;margin-bottom:12px\">1 &nbsp;Who we are<\u002Fdiv>\n<div style=\"font:400 15px/1.85 'Instrument Sans',sans-serif;color:#3A352E;margin-bottom:30px;text-wrap:pretty\">Orla is operated by Orla Technologies, Inc., a Delaware corporation. Where these terms say “we” or “Orla”, they mean that company. Where they say “you”, they mean whoever is reading them — a customer booking a vendor, or a vendor taking bookings.<\u002Fdiv>\n\n<div style=\"font-family:'Instrument Serif',serif;font-size:24px;color:#23201C;margin-bottom:12px\">2 &nbsp;What Orla does<\u002Fdiv>\n<div style=\"font:400 15px/1.85 'Instrument Sans',sans-serif;color:#3A352E;margin-bottom:16px;text-wrap:pretty\">Orla is a marketplace. Vendors publish what they charge and when they are free; customers book them and pay through the platform. We are not a party to the booking itself and we do not supply the service — the contract for the photography, the catering or the venue is between the customer and the vendor.<\u002Fdiv>\n<div style=\"font:400 15px/1.85 'Instrument Sans',sans-serif;color:#3A352E;margin-bottom:30px;text-wrap:pretty\">What we do provide is the booking record, the payment mechanism, the messaging thread and the dispute route described in section 5.<\u002Fdiv>\n\n<div style=\"font-family:'Instrument Serif',serif;font-size:24px;color:#23201C;margin-bottom:12px\">3 &nbsp;Your account<\u002Fdiv>\n<div style=\"font:400 15px/1.85 'Instrument Sans',sans-serif;color:#3A352E;margin-bottom:16px;text-wrap:pretty\">You need an account to book or to be booked, you must be 18 or older, and the details on it must be accurate. Accounts are personal — keep your sign-in to yourself, and tell us if you think someone else has it.<\u002Fdiv>\n<div style=\"font:400 15px/1.85 'Instrument Sans',sans-serif;color:#3A352E;margin-bottom:30px;text-wrap:pretty\">You can close your account at any time. We keep booking and payment records after closure where tax and accounting law requires it; the retention periods are in the <a href=\"#31b\">Privacy Policy<\u002Fa>.<\u002Fdiv>\n\n<div style=\"font-family:'Instrument Serif',serif;font-size:24px;color:#23201C;margin-bottom:12px\">4 &nbsp;Bookings and payment<\u002Fdiv>\n<div style=\"font:400 15px/1.85 'Instrument Sans',sans-serif;color:#3A352E;margin-bottom:16px;text-wrap:pretty\">A booking exists once a vendor accepts your request and you have paid. Payments are processed by Stripe; Orla never sees or stores your card details. The price you see is the price you pay — there is no service fee added at checkout.<\u002Fdiv>\n<div style=\"background:#F1ECE4;border-radius:12px;padding:17px 19px;margin-bottom:30px\">\n<div style=\"font:400 14.5px/1.75 'Instrument Sans',sans-serif;color:#3A352E\">Your payment is <strong style=\"font-weight:600\">held<\u002Fstrong> until the event is complete, then released to the vendor. Orla retains a <strong style=\"font-weight:600\">12% commission<\u002Fstrong> on the released amount. Nothing is charged to the customer on top of the vendor’s published price.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"font-family:'Instrument Serif',serif;font-size:24px;color:#23201C;margin-bottom:12px\">5 &nbsp;Cancellations and refunds<\u002Fdiv>\n<div style=\"font:400 15px/1.85 'Instrument Sans',sans-serif;color:#3A352E;margin-bottom:16px;text-wrap:pretty\">Because the payment is held rather than paid out, a cancellation before the event is a refund rather than a claw-back. The schedule that applies to your booking is shown to you at checkout, before you pay, and repeated in the confirmation email.<\u002Fdiv>\n<div style=\"font:400 15px/1.85 'Instrument Sans',sans-serif;color:#3A352E;margin-bottom:30px;text-wrap:pretty\">If the <em>vendor<\u002Fem> cancels, you are refunded in full regardless of timing. If something goes wrong at the event itself, open the booking and use Contact support within 14 days — we can hold the release while we look at it.<\u002Fdiv>\n\n<div style=\"height:1px;background:#E4DDD1\"><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"width:56px;flex:none\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"tn\" style=\"max-width:1440px\">Frozen mid-page: the rail is <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px\">position:sticky<\u002Fspan> and highlights the section in view, so the frame shows section 1 active with the reader at the top. Numbered headings because Stripe, vendors and support all cite these by number — “section 5” has to mean something.<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:none\" id=\"31b\">\n<div class=\"bp\">1440 · /privacy · same shell<\u002Fdiv>\n<div style=\"font:400 11px/1.45 'Instrument Sans',sans-serif;color:#6B6459;max-width:760px;margin-bottom:8px\">Designed once, used twice — identical measure, rail and last-updated line. The one page-specific element is the data map, which is a table because it is genuinely tabular: what, who holds it, why, how long.<\u002Fdiv>\n<div class=\"fr\" style=\"width:760px;height:900px\" data-screen-label=\"31 Privacy Policy\">\n<div class=\"hd\" style=\"height:56px;padding:0 26px\">\n<div style=\"display:flex;align-items:center;gap:9px\"><div style=\"position:relative;width:21px;height:14px\"><div style=\"position:absolute;left:0;top:0;width:14px;height:14px;border-radius:50%;background:#B4552F\"><\u002Fdiv><div style=\"position:absolute;left:7px;top:0;width:14px;height:14px;border-radius:50%;border:1.2px solid #23201C\"><\u002Fdiv><\u002Fdiv><span style=\"font-family:'Instrument Serif',serif;font-size:18px;color:#23201C\">Orla<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:14px\"><span style=\"font-size:12.5px;font-weight:500;color:#4A443C\">Sign in<\u002Fspan><span style=\"font-size:12px;font-weight:600;color:#FFFDF9;background:#B4552F;padding:8px 15px;border-radius:999px\">Sign up<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1;overflow:hidden;padding:44px 50px 0\">\n<div style=\"max-width:660px\">\n<div class=\"lbl\" style=\"margin-bottom:11px\">Legal<\u002Fdiv>\n<div style=\"font-family:'Instrument Serif',serif;font-size:40px;line-height:1.06;color:#23201C;letter-spacing:-.015em;margin-bottom:13px\">Privacy Policy<\u002Fdiv>\n<div style=\"padding-bottom:22px;border-bottom:1px solid #E4DDD1;margin-bottom:28px;font:400 12.5px 'Instrument Sans',sans-serif;color:#6B6459\">Last updated <strong style=\"font-weight:600;color:#4A443C\">4 June 2026<\u002Fstrong><\u002Fdiv>\n\n<div style=\"font:400 15px/1.85 'Instrument Sans',sans-serif;color:#3A352E;margin-bottom:26px;text-wrap:pretty\">Short version: we hold the booking. Your card is held by Stripe, your sign-in is held by Clerk, and your uploaded files are held by Cloudflare R2. We do not sell anything to anyone, and we run no advertising or analytics trackers.<\u002Fdiv>\n\n<div style=\"font-family:'Instrument Serif',serif;font-size:23px;color:#23201C;margin-bottom:14px\">Where your data actually lives<\u002Fdiv>\n<div style=\"border:1px solid #E4DDD1;border-radius:12px;overflow:hidden;margin-bottom:26px\">\n<div style=\"display:grid;grid-template-columns:1.15fr 1fr 1.5fr;gap:0;background:#F1ECE4;border-bottom:1px solid #E4DDD1\"><span class=\"lbl\" style=\"padding:10px 14px\">What<\u002Fspan><span class=\"lbl\" style=\"padding:10px 14px\">Held by<\u002Fspan><span class=\"lbl\" style=\"padding:10px 14px\">Why<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1.15fr 1fr 1.5fr;gap:0;border-bottom:1px solid #EFE9DF;font:400 13px/1.6 'Instrument Sans',sans-serif;color:#3A352E\"><span style=\"padding:12px 14px;font-weight:600\">Card details<\u002Fspan><span style=\"padding:12px 14px\">Stripe<\u002Fspan><span style=\"padding:12px 14px;color:#4A443C\">Taking the payment. These never reach an Orla server.<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1.15fr 1fr 1.5fr;gap:0;border-bottom:1px solid #EFE9DF;font:400 13px/1.6 'Instrument Sans',sans-serif;color:#3A352E\"><span style=\"padding:12px 14px;font-weight:600\">Name, email, session<\u002Fspan><span style=\"padding:12px 14px\">Clerk<\u002Fspan><span style=\"padding:12px 14px;color:#4A443C\">Signing you in and keeping you signed in.<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1.15fr 1fr 1.5fr;gap:0;border-bottom:1px solid #EFE9DF;font:400 13px/1.6 'Instrument Sans',sans-serif;color:#3A352E\"><span style=\"padding:12px 14px;font-weight:600\">Photos and files<\u002Fspan><span style=\"padding:12px 14px\">Cloudflare R2<\u002Fspan><span style=\"padding:12px 14px;color:#4A443C\">Vendor covers and portfolio images.<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1.15fr 1fr 1.5fr;gap:0;border-bottom:1px solid #EFE9DF;font:400 13px/1.6 'Instrument Sans',sans-serif;color:#3A352E\"><span style=\"padding:12px 14px;font-weight:600\">Bookings, messages<\u002Fspan><span style=\"padding:12px 14px\">Orla<\u002Fspan><span style=\"padding:12px 14px;color:#4A443C\">The record of what was agreed, and the thread about it.<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1.15fr 1fr 1.5fr;gap:0;font:400 13px/1.6 'Instrument Sans',sans-serif;color:#3A352E;background:#FBF8F3\"><span style=\"padding:12px 14px;font-weight:600\">Payout details<\u002Fspan><span style=\"padding:12px 14px\">Stripe<\u002Fspan><span style=\"padding:12px 14px;color:#4A443C\">Vendors only. Collected by Stripe Connect, not by us.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;align-items:flex-start;gap:11px;background:#EDF0E9;border-radius:12px;padding:15px 17px\">\n<svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#4B5940\" stroke-width=\"1.6\" stroke-linejoin=\"round\" style=\"flex:none;margin-top:3px\"><path d=\"M12 3l7 2.6v5.6c0 4.4-2.9 7.6-7 9.2-4.1-1.6-7-4.8-7-9.2V5.6z\"><\u002Fpath><path d=\"M8.8 12l2.3 2.3 4.1-4.4\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n<div style=\"font:400 13.5px/1.7 'Instrument Sans',sans-serif;color:#3A352E\">No advertising networks, no analytics vendors, no data brokers. If that ever changes we will say so here and ask you first.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:none\">\n<div class=\"bp\">1440 · /cookies · deliberately thin<\u002Fdiv>\n<div style=\"font:400 11px/1.45 'Instrument Sans',sans-serif;color:#6B6459;max-width:640px;margin-bottom:8px\">No jump rail, because there is nothing to jump between. One measure, one table row, and a plain statement of why there is no consent banner — the app sets no cookies of its own and loads no trackers.<\u002Fdiv>\n<div class=\"fr\" style=\"width:640px;height:640px\" data-screen-label=\"31 Cookie notice\">\n<div class=\"hd\" style=\"height:56px;padding:0 24px\">\n<div style=\"display:flex;align-items:center;gap:9px\"><div style=\"position:relative;width:21px;height:14px\"><div style=\"position:absolute;left:0;top:0;width:14px;height:14px;border-radius:50%;background:#B4552F\"><\u002Fdiv><div style=\"position:absolute;left:7px;top:0;width:14px;height:14px;border-radius:50%;border:1.2px solid #23201C\"><\u002Fdiv><\u002Fdiv><span style=\"font-family:'Instrument Serif',serif;font-size:18px;color:#23201C\">Orla<\u002Fspan><\u002Fdiv>\n<span style=\"font-size:12.5px;font-weight:500;color:#4A443C\">Sign in<\u002Fspan>\n<\u002Fdiv>\n<div style=\"flex:1;overflow:hidden;padding:40px 44px\">\n<div class=\"lbl\" style=\"margin-bottom:11px\">Legal<\u002Fdiv>\n<div style=\"font-family:'Instrument Serif',serif;font-size:36px;line-height:1.08;color:#23201C;letter-spacing:-.015em;margin-bottom:12px\">Cookie notice<\u002Fdiv>\n<div style=\"padding-bottom:20px;border-bottom:1px solid #E4DDD1;margin-bottom:24px;font:400 12.5px 'Instrument Sans',sans-serif;color:#6B6459\">Last updated <strong style=\"font-weight:600;color:#4A443C\">4 June 2026<\u002Fstrong><\u002Fdiv>\n<div style=\"font:400 15px/1.85 'Instrument Sans',sans-serif;color:#3A352E;margin-bottom:22px;text-wrap:pretty\">Orla uses one cookie. It keeps you signed in. That is the whole notice.<\u002Fdiv>\n<div style=\"border:1px solid #E4DDD1;border-radius:12px;overflow:hidden;margin-bottom:22px\">\n<div style=\"display:grid;grid-template-columns:1fr 1fr 1.3fr;background:#F1ECE4;border-bottom:1px solid #E4DDD1\"><span class=\"lbl\" style=\"padding:10px 13px\">Cookie<\u002Fspan><span class=\"lbl\" style=\"padding:10px 13px\">Set by<\u002Fspan><span class=\"lbl\" style=\"padding:10px 13px\">Purpose<\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr 1.3fr;font:400 13px/1.6 'Instrument Sans',sans-serif;color:#3A352E\"><span style=\"padding:12px 13px;font-family:'JetBrains Mono',monospace;font-size:12px\">__session<\u002Fspan><span style=\"padding:12px 13px\">Clerk<\u002Fspan><span style=\"padding:12px 13px;color:#4A443C\">Strictly necessary — your sign-in.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"font:400 15px/1.85 'Instrument Sans',sans-serif;color:#3A352E;text-wrap:pretty\">We set no cookies of our own and load no analytics, advertising or session-recording scripts. A strictly necessary cookie needs no consent, so you will not see a banner. If we ever add anything measuring behaviour, this page changes first and the banner arrives with it.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<div style=\"max-width:1440px;margin-top:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px\">\n<div class=\"tile\"><div class=\"tl\">One shell, three pages<\u002Fdiv><div class=\"tn\" style=\"margin-top:0\">The reading layout is the deliverable: 660px measure, prose at <strong style=\"font-weight:600;color:#4A443C\">15px/1.85<\u002Fstrong> against the app’s 13.5px/1.6, serif numbered headings, sticky jump rail past ~6 sections. <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px\">/terms<\u002Fspan> and <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px\">/privacy<\u002Fspan> use it whole; <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px\">/cookies<\u002Fspan> drops the rail. No new colours, no new components — the data map reuses the admin table idiom.<\u002Fdiv><\u002Fdiv>\n<div class=\"tile\"><div class=\"tl\" style=\"color:#A8321E\">The footer needs a legal row<\u002Fdiv><div class=\"tn\" style=\"margin-top:0\">These are reached from the footer on every page, and the footer drawn in frame <strong style=\"font-weight:600;color:#4A443C\">30<\u002Fstrong> has four columns with no legal links in any of them. That is a change to a component on every screen in this document, so it is a decision rather than a detail: a fifth <strong style=\"font-weight:600;color:#4A443C\">Legal<\u002Fstrong> column, or a thin bottom line under the grid carrying Terms · Privacy · Cookies · © Orla 2026. I’d take the bottom line — a column gives three links the same visual weight as Browse.<\u002Fdiv><\u002Fdiv>\n<div class=\"tile\"><div class=\"tl\">Copy is placeholder-real, not final<\u002Fdiv><div class=\"tn\" style=\"margin-top:0\">The clauses are written to the right length and register so the layout is honest, and the factual claims match the actual stack — Stripe for cards, Clerk for identity, R2 for files, 12% commission. But this is <strong style=\"font-weight:600;color:#4A443C\">not reviewed legal copy<\u002Fstrong>, and section 5’s refund schedule is stated as “shown at checkout” precisely because the real schedule is still open (see frame <a href=\"#33a\">33<\u002Fa>).<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"sc\" id=\"32a\">\n<div class=\"sc-h\"><span class=\"sc-n\">32<\u002Fspan><span class=\"sc-t\">Vendor agreement — a flow surface, not a page<\u002Fspan><span class=\"sc-mvp\">MVP<\u002Fspan><span class=\"sc-d\">The only legal surface with an <em>action<\u002Fem> in it. A vendor cannot be paid until they have accepted, so this is a step in onboarding with a record attached — not prose behind a footer link. Three things it must do: say what is being agreed to in language a photographer reads once, state the <strong style=\"font-weight:600;color:#4A443C\">12% commission and the payout timing<\u002Fstrong> plainly rather than burying them in clause 7, and leave a durable record of who accepted and when.<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap\">\n\n<div style=\"flex:none\">\n<div class=\"bp\">1440 · unaccepted <span style=\"opacity:.6\">— the blocking state<\u002Fspan><\u002Fdiv>\n<div class=\"fr\" style=\"height:940px\" data-screen-label=\"32 Vendor agreement — unaccepted\">\n<div class=\"hd\">\n<div style=\"display:flex;align-items:center;gap:9px\"><div style=\"position:relative;width:22px;height:15px\"><div style=\"position:absolute;left:0;top:0;width:15px;height:15px;border-radius:50%;background:#B4552F\"><\u002Fdiv><div style=\"position:absolute;left:7px;top:0;width:15px;height:15px;border-radius:50%;border:1.2px solid #23201C\"><\u002Fdiv><\u002Fdiv><span style=\"font-family:'Instrument Serif',serif;font-size:19px;color:#23201C\">Orla<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:14px\"><span style=\"font:400 12.5px 'Instrument Sans',sans-serif;color:#6B6459\">Step 3 of 5<\u002Fspan><div style=\"width:30px;height:30px;border-radius:50%;background:#F7E7E0;display:flex;align-items:center;justify-content:center;font-family:'Instrument Serif',serif;font-size:13px;color:#8E3F20\">JH<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1;overflow:hidden;display:flex;justify-content:center;padding:38px 32px 0\">\n<div style=\"width:100%;max-width:700px\">\n\n<div style=\"display:flex;align-items:center;gap:0;margin-bottom:30px\">\n<div style=\"display:flex;align-items:center;gap:8px\"><div style=\"width:20px;height:20px;border- #E4DDD1;margin:0 10px\"><\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:8px\"><div style=\"width:20px;height:20px;border-radius:50%;border:1.4px solid #DFD8CB;display:flex;align-items:center;justify-content:center;font:500 11px 'Instrument Sans',sans-serif;color:#9A9184\">5<\u002Fdiv><span style=\"font:400 12px 'Instrument Sans',sans-serif;color:#9A9184\">Publish<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"font-family:'Instrument Serif',serif;font-size:34px;line-height:1.1;color:#23201C;letter-spacing:-.015em;margin-bottom:10px\">The vendor agreement<\u002Fdiv>\n<div style=\"font:400 14px/1.7 'Instrument Sans',sans-serif;color:#4A443C;margin-bottom:24px;max-width:600px\">Read this once and accept it. You cannot take payments until you have, because it is the agreement Stripe pays you under.<\u002Fdiv>\n\n<div style=\"background:#F1ECE4;border-radius:14px;padding:19px 21px;margin-bottom:22px\">\n<div class=\"lbl\" style=\"margin-bottom:14px\">The four terms that cost you money<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:18px 26px\">\n<div><div style=\"font:400 12px 'Instrument Sans',sans-serif;color:#6B6459;margin-bottom:3px\">Commission<\u002Fdiv><div style=\"font-family:'Instrument Serif',serif;font-size:27px;color:#23201C;line-height:1.1;margin-bottom:4px\">12%<\u002Fdiv><div style=\"font:400 12.5px/1.6 'Instrument Sans',sans-serif;color:#4A443C\">Deducted from each booking when it is released. Nothing monthly, nothing for listing.<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:400 12px 'Instrument Sans',sans-serif;color:#6B6459;margin-bottom:3px\">Payout timing<\u002Fdiv><div style=\"font-family:'Instrument Serif',serif;font-size:27px;color:#23201C;line-height:1.1;margin-bottom:4px\">Event + 2 days<\u002Fdiv><div style=\"font:400 12.5px/1.6 'Instrument Sans',sans-serif;color:#4A443C\">Released two business days after the event date, then Stripe’s own transfer time to your bank.<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:400 12px 'Instrument Sans',sans-serif;color:#6B6459;margin-bottom:3px\">Cancellations<\u002Fdiv><div style=\"font:400 13px/1.65 'Instrument Sans',sans-serif;color:#3A352E\">If you cancel a confirmed booking, the customer is refunded in full and no commission is taken. Repeated cancellations can end your listing.<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:400 12px 'Instrument Sans',sans-serif;color:#6B6459;margin-bottom:3px\">Your prices<\u002Fdiv><div style=\"font:400 13px/1.65 'Instrument Sans',sans-serif;color:#3A352E\">You set them and you keep them accurate. Orla adds no fee on top, so the customer pays exactly what you published.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"border:1px solid #E4DDD1;border-radius:14px;background:#FFFDF9;margin-bottom:20px;overflow:hidden\">\n<div style=\"display:flex;align-items:center;justify-content:space-between;padding:12px 17px;border-bottom:1px solid #EFE9DF;background:#FBF8F3\"><span class=\"lbl\">Full agreement<\u002Fspan><span style=\"font:400 12px 'Instrument Sans',sans-serif;color:#6B6459\">11 sections · v1.0 · 4 Jun 2026<\u002Fspan><\u002Fdiv>\n<div style=\"padding:16px 17px 0;position:relative;height:150px;overflow:hidden\">\n<div style=\"font:600 13.5px 'Instrument Sans',sans-serif;color:#23201C;margin-bottom:7px\">1 &nbsp;Listing and accuracy<\u002Fdiv>\n<div style=\"font:400 13.5px/1.75 'Instrument Sans',sans-serif;color:#3A352E;margin-bottom:14px\">You are responsible for what appears on your profile: the prices, the availability, the images and the description of what a customer receives. You confirm you hold the rights to every image you upload and that you are permitted to trade in the places you list.<\u002Fdiv>\n<div style=\"font:600 13.5px 'Instrument Sans',sans-serif;color:#23201C;margin-bottom:7px\">2 &nbsp;Accepting a booking<\u002Fdiv>\n<div style=\"font:400 13.5px/1.75 'Instrument Sans',sans-serif;color:#3A352E\">Once you accept a request it is a contract between you and that customer, for the date, price and scope shown on it.<\u002Fdiv>\n<div style=\"position:absolute;left:0;right:0;bottom:0;height:56px;background:linear-gradient(180deg,rgba(255,253,249,0) 0%,#FFFDF9 82%)\"><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:0 17px 14px;display:flex;align-items:center;gap:14px\"><span style=\"font-size:12.5px;font-weight:600;color:#A34A28\">Read all 11 sections<\u002Fspan><span style=\"font:400 12px 'Instrument Sans',sans-serif;color:#6B6459\">Opens in this step — you don’t lose your place.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display:flex;align-items:flex-start;gap:11px;margin-bottom:18px\">\n<div style=\"width:19px;height:19px;border-radius:5px;border:1.6px solid #C2B9A9;background:#FFFDF9;flex:none;margin-top:1px\"><\u002Fdiv>\n<div style=\"font:400 13.5px/1.65 'Instrument Sans',sans-serif;color:#3A352E;max-width:560px\">I have read the vendor agreement and I accept it on behalf of <strong style=\"font-weight:600\">June Harlow Photography<\u002Fstrong>. I understand Orla retains 12% of each booking.<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;gap:16px\">\n<span style=\"font-size:13.5px;font-weight:600;color:#FFFDF9;background:#D9BFAF;padding:11px 22px;border-radius:10px;display:inline-block\">Accept and continue<\u002Fspan>\n<span style=\"font:400 12.5px 'Instrument Sans',sans-serif;color:#6B6459\">Disabled until the box is ticked. Next: connect payouts.<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:none\">\n<div class=\"bp\">1440 · accepted <span style=\"opacity:.6\">— the record<\u002Fspan><\u002Fdiv>\n<div style=\"font:400 11px/1.45 'Instrument Sans',sans-serif;color:#6B6459;max-width:700px;margin-bottom:8px\">Not a success banner that disappears. Acceptance becomes a permanent row in <strong style=\"font-weight:600;color:#4A443C\">Settings → Legal<\u002Fstrong> naming the person, the version and the timestamp — because “which version di  style=\"font:400 10.5px 'Instrument Sans',sans-serif;color:#6B6459;text-align:center;margin-top:7px\">Held until 14 June. You accept the refund schedule above.<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n<div style=\"max-width:1440px;margin-top:16px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px\">\n<div class=\"tile\"><div class=\"tl\">Shown, not linked<\u002Fdiv><div class=\"tn\" style=\"margin-top:0\">The whole point of this frame is that the schedule is <em>in the pay composition<\u002Fem>. It costs 4 rows and one line of caption, it goes above the button, and the button’s subline references it rather than a footer page. Nothing about the frame-05 layout changes — the rail was already the column that carries commitments.<\u002Fdiv><\u002Fdiv>\n<div class=\"tile\"><div class=\"tl\" style=\"color:#A8321E\">The schedule itself is a product decision I’ve guessed<\u002Fdiv><div class=\"tn\" style=\"margin-top:0\"><strong style=\"font-weight:600;color:#4A443C\">30 days / 50% / non-refundable<\u002Fstrong> is a plausible events-industry default, not something in the plan. It is drawn concretely because a vague block is worse than none. Two open questions behind it: is the schedule <strong style=\"font-weight:600;color:#4A443C\">platform-wide or per-vendor<\u002Fstrong> (per-vendor means the vendor editor grows a field and the search card should surface it), and does “non-refundable” still release the full amount to the vendor, or does Orla waive commission on a cancelled booking?<\u002Fdiv><\u002Fdiv>\n<div class=\"tile\"><div class=\"tl\">Where else it has to appear<\u002Fdiv><div class=\"tn\" style=\"margin-top:0\">Once this exists it belongs in three more places, all of which are cheap: the confirmation screen (frame <strong style=\"font-weight:600;color:#4A443C\">06<\u002Fstrong>) and its email, the booking detail in the customer hub (frame <strong style=\"font-weight:600;color:#4A443C\">07<\u002Fstrong>) where the applicable row should be the <em>only<\u002Fem> one shown, and <span style=\"font-family:'JetBrains Mono',monospace;font-size:10.5px\">/terms<\u002Fspan> section 5, which currently defers to it by reference. I have not drawn those — say the word.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1400,&quot;height&quot;:1000}}\">\nclass Component extends DCLogic {\n  renderVals() { return {}; }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
