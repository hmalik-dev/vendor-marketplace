# The release path (VEN-397, VEN-494, VEN-633), one run per environment.
#
#   CI succeeds on a push to `staging` or `production` (never `main`, which is
#   integration only); the branch names the environment and its GitHub
#   environment, so each has its own secrets and variables. From there, one
#   step — `node scripts/deploy.mjs release` — runs gate, preflight, the
#   sender check, the web build, the migration, the API deploy, the web
#   deploy and the readiness poll, in that order (`scripts/deploy.mjs`'s own
#   header names each phase and why). The web is *built* before anything else
#   moves and *deployed* only once the API is already live, so the step most
#   likely to fail — `vercel build` — fails before the API has moved. The
#   ordering guarantees the web is never *ahead* of the API, not that the two
#   always match: a web deploy that fails after the API is live leaves the API a
#   commit ahead, and the failure names both commits and the runbook step
#   ("A release that stopped after the API", docs/runbook-rollback.md).
#
#   VEN-634: a person can also start a run by hand (`workflow_dispatch`, inputs
#   `environment` and `sha`) to redeploy an environment's tip, for instance after
#   fixing a provider variable. A manual run checks out the environment
#   branch's tip, never the `sha` it was handed, and fails before anything of
#   that commit runs unless the tip is that sha: the code that judges the release
#   is always what the branch holds, as on the CI-triggered path. There is no CI
#   run to lean on, so the gate then looks up CI's conclusion for the commit and
#   refuses one that is not green.
#
#   VEN-633: this file names no phase itself. Promoting an older commit runs
#   that commit's own `deploy.mjs release`, so a phase `main`'s workflow
#   gained since cannot be called on a script that predates it — the failure
#   mode this file used to have when each phase was its own step here.
#
# `release` fails closed and stops at the first failing phase — a missing
# input, an unverified sender, a failed build, a failed migration, a failed
# deploy or a failed readiness poll all stop the run before anything past that
# point moves — and `scripts/deploy.test.mjs` dry-runs this file to prove it.
# Migrations therefore always run against the *previous* release's code, so
# every one of them must be backwards-compatible with it — additive columns,
# never a destructive rename in one step.
#
# There is deliberately no automatic rollback: a failed release stops and says
# so, and deciding whether to revert or fix forward is a person's.
#
# The API host is Railway (decision D10, confirmed); it is chosen by the
# variable API_HOST and implemented by one entry in scripts/deploy.mjs. A run
# exists only because someone pushed a release branch, so preflight fails by
# name on any input not set on that GitHub environment rather than skipping.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [staging, production]
  workflow_dispatch:
    inputs:
      environment:
        description: The environment to redeploy.
        type: choice
        required: true
        options: [staging, production]
      sha:
        description: The full commit sha. It must be the environment branch's current tip.
        type: string
        required: true

# One deploy per environment at a time, and never one cancelled mid-migration. A
# newer run waits for the running one; GitHub keeps only the newest waiting run,
# which is correct, since it carries every commit the discarded one would have
# shipped.
concurrency:
  group: deploy-${{ github.event.workflow_run.head_repository.full_name || github.repository }}-${{ github.event.workflow_run.head_branch || inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  # A manual release asks which conclusion CI reached for the commit (`gh run list`).
  actions: read

jobs:
  deploy:
    name: Migrate, deploy, prove ready
    # A CI run must have succeeded: `skipped`, `cancelled`, `failure`,
    # `timed_out` and `action_required` are all not passing, and a pull request's
    # CI run never deploys. The `on:` filter already limits the branches; the two
    # names are repeated because the branch becomes the environment below. A
    # manual run is let through here and held by the gate phase, which looks up
    # CI's conclusion itself. The `release` step's gate phase checks all of it
    # again, where it is tested.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      (github.event.workflow_run.head_branch == 'staging' || github.event.workflow_run.head_branch == 'production'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ${{ github.event.workflow_run.head_branch || inputs.environment }}
    env:
      TURBO_TELEMETRY_DISABLED: 1
      # The environment this run deploys: `staging` or `production`.
      DEPLOY_TARGET: ${{ github.event.workflow_run.head_branch || inputs.environment }}
      # The release identifier, end to end: the API reports it to Sentry and
      # names it on /ready, the web bundle inlines it and uploads its source
      # maps under it, and the poll waits for /ready to say it.
      SENTRY_RELEASE: ${{ github.event.workflow_run.head_sha || inputs.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || format('refs/heads/{0}', inputs.environment) }}

      # Before `pnpm install` or any script of this commit runs: what was checked
      # out is what was asked for. For a manual run that means `sha` is the branch's
      # tip, so a dispatch can never run a commit that is not on the branch (a
      # fork's pull request head, say) with this job's secrets.
      - name: Confirm the checkout is the commit requested
        env:
          REQUESTED_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
        run: |
          head=$(git rev-parse HEAD)
          if [ "$head" != "$REQUESTED_SHA" ]; then
            echo "::error::${REQUESTED_SHA:0:7} is not ${DEPLOY_TARGET}'s tip (${head:0:7}); a release deploys only the tip."
            exit 1
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # The migrator, the seed and the poll import the workspace packages' builds.
      - name: Install and build the release tooling
        run: |
          pnpm install --frozen-lockfile
          pnpm turbo run build --filter=@vendor-marketplace/db --filter=@vendor-marketplace/shared

      # Gate, preflight, sender, web build, migrate, api, web deploy, ready —
      # scripts/deploy.mjs's `release` phase, and nothing else, decides the
      # order and the stop-on-failure (VEN-633). Every credential a later
      # phase needs is handed to this one step, so `deploy.mjs` can still hand
      # each phase's own *child processes* (git, pnpm, npx) only the argv and
      # env each one needs — that scoping happens per phase, inside the
      # script, same as before. It is not process isolation: this step's own
      # `node` process holds every credential above for its whole run, so a
      # compromised dependency of any phase (`vercel`, `@railway/cli`, a
      # build plugin) could in principle read another phase's secret out of
      # this process's own environment, not only the one it was handed. This
      # is the trade-off AC3 asks for — one step naming no phase — over the
      # narrower per-step credential scope this file used to have.
      - name: Release
        env:
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_EVENT: ${{ github.event.workflow_run.event || github.event_name }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
          # gate, manual releases only: the read of CI's conclusion for the commit.
          GH_TOKEN: ${{ github.token }}
          # Handed to preflight as presence flags only, never a value.
          HAS_DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED != '' }}
          HAS_NEON_BRANCH: ${{ vars.NEON_BRANCH != '' }}
          HAS_NEON_HOST: ${{ vars.NEON_HOST != '' }}
          HAS_API_HOST: ${{ vars.API_HOST != '' }}
          HAS_API_SERVICE: ${{ vars.API_SERVICE != '' }}
          HAS_API_HOST_TOKEN: ${{ secrets.API_HOST_TOKEN != '' }}
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
          HAS_VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID != '' }}
          HAS_VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID != '' }}
          HAS_SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN != '' }}
          HAS_SENTRY_WEB_PROJECT: ${{ vars.SENTRY_WEB_PROJECT != '' }}
          HAS_WEB_TIER_KEY: ${{ secrets.WEB_TIER_KEY != '' }}
          HAS_NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET != '' }}
          HAS_API_URL: ${{ vars.API_URL != '' }}
          HAS_WEB_URL: ${{ vars.WEB_URL != '' }}
          HAS_EMAIL_FROM: ${{ vars.EMAIL_FROM != '' }}
          HAS_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY != '' }}
          HAS_NEON_AUTH_BASE_URL: ${{ vars.NEON_AUTH_BASE_URL != '' }}
          HAS_NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID != '' }}
          HAS_NEON_API_KEY: ${{ secrets.NEON_API_KEY != '' }}
          # migrate: the unpooled URL and nothing else; NEON_BRANCH names the
          # branch it belongs to and NEON_HOST its endpoint, so migrate can
          # refuse a value that silently fell back from the other tier.
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          NEON_BRANCH: ${{ vars.NEON_BRANCH }}
          NEON_HOST: ${{ vars.NEON_HOST }}
          # api
          API_HOST: ${{ vars.API_HOST }}
          API_SERVICE: ${{ vars.API_SERVICE }}
          API_HOST_TOKEN: ${{ secrets.API_HOST_TOKEN }}
          # web-build / web-deploy. WEB_TIER_KEY and NEON_AUTH_COOKIE_SECRET
          # reach `vercel build`'s own environment only (VEN-575).
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_WEB_PROJECT: ${{ vars.SENTRY_WEB_PROJECT }}
          WEB_TIER_KEY: ${{ secrets.WEB_TIER_KEY }}
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}
          # Staging aliases its preview deployment to this host.
          WEB_URL: ${{ vars.WEB_URL }}
          # VEN-599: injected into `vercel build`'s own environment, never left to
          # Vercel's per-environment dashboard configuration via `vercel pull`.
          API_URL: ${{ vars.API_URL }}
          # sender
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # preflight (VEN-660): asks Neon whether NEON_AUTH_BASE_URL and WEB_URL
          # are NEON_BRANCH's own Neon Auth; api and web-deploy then ship that value.
          NEON_AUTH_BASE_URL: ${{ vars.NEON_AUTH_BASE_URL }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          # ready
          SMOKE_DEADLINE_MS: '600000'
        run: node scripts/deploy.mjs release
