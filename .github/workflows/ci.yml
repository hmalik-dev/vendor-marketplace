name: CI

on:
  push:
    branches: [main, staging, production]
  pull_request:
    branches: [main, production]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  # Most suites boot an in-process Postgres (PGlite) and need no server. The
  # contention suites do — PGlite is one connection, so a row lock there cannot
  # be told apart from its absence — and they run against the service container
  # below, each creating and dropping a database of its own on it. The db
  # package also validates that a URL is configured, which this satisfies.
  DATABASE_URL: postgresql://vendor_marketplace:vendor_marketplace_ci@localhost:5432/vendor_marketplace
  # The web build validates the `auth` capability, so both Neon Auth values must
  # be well-formed. CI never reaches Neon's servers. The cookie key signs
  # nothing real, so it is derived (the commit hash, twice)
  # rather than written down: a literal here would read as a credential.
  NEON_AUTH_BASE_URL: https://ep-ci.neonauth.example.invalid/neondb/auth
  NEON_AUTH_COOKIE_SECRET: ${{ github.sha }}${{ github.sha }}
  NEXT_PUBLIC_API_URL: http://localhost:4000
  # Same category, and required for the same reason since #406 made the web
  # build validate the `stripe` capability: the registry gives this row a
  # placeholder rather than a default, so — like the auth key above — it must
  # be stated on every build, not only a deployed one.
  #
  # Inline rather than a repository secret, deliberately. A Stripe
  # **publishable** key is public by construction: the build inlines it into the
  # browser bundle, where every visitor reads it. This one is fabricated and
  # reaches nothing. The value that must never appear in a tracked file is the
  # *secret* key, which is absent here and stays absent.
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci000000000000000000

jobs:
  # The static half of the required check: everything that reads the tree and
  # nothing that runs a suite. The suites are sharded across `test` and
  # `contention` below so the required check's wall time is the slowest shard,
  # not their sum (VEN-716).
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup

      # Next's own compiler cache, so an unchanged page is not compiled again.
      # Turbo restores the build outputs; this is the cache it deliberately
      # leaves out (`!.next/cache/**`).
      - name: Cache the Next build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # First, and on its own: a pre-commit hook can be skipped with
      # `--no-verify`, so the same scan runs here over every tracked file. This
      # is the copy that cannot be bypassed.
      - name: Scan for committed credentials
        run: pnpm secrets:scan:all

      # A destructive statement in a migration added after launch (VEN-463).
      - name: Check migrations for destructive statements
        run: pnpm migrations:check

      # Production dependencies only, and only what is high or worse (VEN-397).
      # A finding with no upstream fix is pinned past in `pnpm.overrides`, never
      # ignored, so this step cannot go quiet about a new advisory.
      - name: Audit production dependencies
        run: pnpm audit --audit-level high --prod

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm build

      # The orchestration machinery under .claude/ (the hunt-bugs workflow, the
      # schema-migration guard, the workflow pin guard) has its own tests. They
      # are plain node scripts, so `turbo run test` — which only fans out across
      # packages — never saw them. Without this step a regression in a hook or a
      # workflow ships green.
      - name: Test agent workflows and hooks
        run: pnpm test:agents

  # `pnpm test`, split. Most suites boot an in-process Postgres (PGlite) and need
  # no server, so a shard is only a runner, an install and a slice of files.
  # Vitest deals the test files across `--shard=i/n` by a stable hash of the path,
  # so every file runs in exactly one shard and the union is the whole suite.
  # Tests import the workspace packages' built output — the preflight suite reads
  # the API's sources, which import `db`'s — so every package is built first, and
  # no app is (the apps' own builds are `static`'s).
  test:
    name: Test ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: web 1/4, pkg: '@vendor-marketplace/web', shard: 1/4 }
          - { name: web 2/4, pkg: '@vendor-marketplace/web', shard: 2/4 }
          - { name: web 3/4, pkg: '@vendor-marketplace/web', shard: 3/4 }
          - { name: web 4/4, pkg: '@vendor-marketplace/web', shard: 4/4 }
          - { name: api 1/4, pkg: '@vendor-marketplace/api', shard: 1/4 }
          - { name: api 2/4, pkg: '@vendor-marketplace/api', shard: 2/4 }
          - { name: api 3/4, pkg: '@vendor-marketplace/api', shard: 3/4 }
          - { name: api 4/4, pkg: '@vendor-marketplace/api', shard: 4/4 }
          - { name: db 1/2, pkg: '@vendor-marketplace/db', shard: 1/2 }
          - { name: db 2/2, pkg: '@vendor-marketplace/db', shard: 2/2 }
          - { name: preflight, pkg: '@vendor-marketplace/preflight', shard: 1/1 }
          - { name: shared, pkg: '@vendor-marketplace/shared', shard: 1/1 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup

      - name: Build the workspace packages
        run: pnpm turbo run build --filter='./packages/*'

      - name: Run the suite shard
        run: pnpm --filter '${{ matrix.pkg }}' exec vitest run --shard=${{ matrix.shard }}

  # Two connections to one database, which PGlite cannot be. Kept out of the
  # sharded suites so those stay runnable with nothing but Node; here a server is
  # guaranteed, so failing to reach one is a real failure (#399).
  contention:
    name: Test contention
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # The major must track the one Neon runs and the one docker-compose.yml
      # pins; a drift test in `packages/preflight` fails if the three disagree.
      #
      # `trust` rather than a password: the container lives for one job, listens
      # only on the runner's loopback and holds nothing but throwaway test
      # databases, and a password written here would be a credential-shaped
      # literal in version control for no gain. The password half of
      # DATABASE_URL above is simply ignored.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vendor_marketplace
          POSTGRES_DB: vendor_marketplace
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendor_marketplace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/setup

      - run: pnpm test:contention

  # The required check. Its name is what branch protection names, so it stays
  # exactly what it was when this was one serial job; it is now the verdict of the
  # jobs above, and fails when any of them did not succeed (skipped and cancelled
  # included: a skipped required check reads as passing). `if: always()` is what
  # makes it run to say so.
  verify:
    name: Typecheck, lint, build, test
    needs: [static, test, contention]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || { echo "::error::a required job finished as '$result'"; exit 1; }
          done

  # gitleaks over every commit in the history, on every push and pull request
  # this workflow sees (VEN-397). `pnpm secrets:scan:all` above reads the tree
  # as it stands; a credential committed and then deleted is still in a pushed
  # history, and that is the one failure no local fix repairs — it is rotated.
  # A job of its own, so it reports in seconds and needs no install.
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      # Pinned and checksummed rather than a marketplace action: the action
      # needs a licence key for an organisation and runs whatever version it
      # resolves, where this runs exactly the binary whose digest is below.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Before the real scan, so a config that allowlists too much — or a binary
      # that scans nothing — cannot pass it for the wrong reason.
      - name: Prove the scan flags a planted credential
        run: node --test scripts/gitleaks/planted.test.mjs

      - name: Scan every commit
        run: gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose

  # The committed Playwright journeys against the whole stack — built, served
  # with `next start`, real auth test instance, Stripe test mode with webhooks
  # forwarded (VEN-411). After `verify`, so a pull request that does not compile
  # spends no browser minutes.
  #
  # Until the repository secrets below exist (VEN-377) the first step skips the
  # suite with a warning rather than failing every pull request in the fleet.
  # Once they do, set the repository variable `E2E_GATE=required` — a missing
  # secret then fails the job — and add this job's name to the required checks
  # on `main`. `scripts/e2e-ci.mjs` holds both decisions and their tests.
  e2e:
    name: End-to-end journeys
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # This job holds the Stripe and auth secrets, so its token reads and nothing more.
    permissions:
      contents: read
    # One run per branch. The workflow-level group already cancels a superseded
    # push; this also keeps two runs of one branch off the shared E2E accounts
    # and the pinned Stripe connected account at once.
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true

    services:
      # Same image and trust rationale as `verify`'s.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vendor_marketplace
          POSTGRES_DB: vendor_marketplace
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendor_marketplace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Everything not set here is inherited from the workflow's `env:` above,
    # No journey signs a webhook.
    env:
      E2E_GATE: ${{ vars.E2E_GATE }}
      # Where the run's storage branch is made; also named in preview-branch.yml.
      NEON_PROJECT_ID: dark-surf-79137727
      # The stack's own origins, which the E2E harness refuses to guess.
      PORT: '4000'
      WEB_PORT: '3000'
      API_URL: http://localhost:4000
      WEB_URL: http://localhost:3000
      E2E_BASE_URL: http://localhost:3000
      E2E_API_URL: http://localhost:4000
      # A full pass exceeds the default 120 requests a minute, and a 429 renders
      # as the generic 500 page (`apps/web/e2e/README.md`).
      RATE_LIMIT_MAX: '100000'
      # The secrets. GitHub masks each value in the log wherever it appears.
      NEON_AUTH_BASE_URL: ${{ secrets.E2E_NEON_AUTH_BASE_URL }}
      NEON_AUTH_COOKIE_SECRET: ${{ secrets.E2E_NEON_AUTH_COOKIE_SECRET }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.E2E_STRIPE_PUBLISHABLE_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
      E2E_VENDOR_STRIPE_ACCOUNT_ID: ${{ secrets.E2E_VENDOR_STRIPE_ACCOUNT_ID }}
      E2E_CUSTOMER_EMAIL: ${{ secrets.E2E_CUSTOMER_EMAIL }}
      E2E_CUSTOMER_PASSWORD: ${{ secrets.E2E_CUSTOMER_PASSWORD }}
      E2E_VENDOR_EMAIL: ${{ secrets.E2E_VENDOR_EMAIL }}
      E2E_VENDOR_PASSWORD: ${{ secrets.E2E_VENDOR_PASSWORD }}
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
      # The persistent no-row newcomer (VEN-379): an identity nothing may accept
      # the Terms for. Optional here, so a repository without the two secrets
      # still runs everything else; the two specs that need it fail by name.
      E2E_NEWCOMER_EMAIL: ${{ secrets.E2E_NEWCOMER_EMAIL }}
      E2E_NEWCOMER_PASSWORD: ${{ secrets.E2E_NEWCOMER_PASSWORD }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check the E2E secrets are configured
        id: secrets
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node scripts/e2e-ci.mjs secrets

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.secrets.outputs.run == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.secrets.outputs.run == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - if: steps.secrets.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      # One web-tier key per run, shared by the API, the web app and the
      # journeys through the job environment: a sign-up records its role at the
      # API's internal route, which exists only when the key is set (VEN-662),
      # and the refused-vendor journey records the newcomer's role there itself.
      # Generated, never a literal, and masked like the secrets above.
      - name: Generate this run's web tier key
        if: steps.secrets.outputs.run == 'true'
        run: |
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "WEB_TIER_KEY=$key" >> "$GITHUB_ENV"

      # Uploads go to Neon Object Storage, which has no emulator, so this run
      # gets a storage-only branch of its own (`ci-<run>-<attempt>`, cut from
      # `dev`, no compute) and its STORAGE_* values reach the later steps through
      # the job environment, masked. It is deleted by the `always()` step at the
      # end; the one-day expiry is the backstop for a run that never gets there.
      # The pull file is created owner-only first: the CLI keeps an existing
      # file's mode, and it would otherwise be written world-readable.
      # Its own step, with no credential in scope and no install scripts: a
      # global install resolves unpinned transitive dependencies afresh.
      - name: Install the Neon CLI
        if: steps.secrets.outputs.run == 'true'
        run: npm install --global --ignore-scripts neonctl@4.11.0

      - name: Create this run's storage branch
        id: storage
        if: steps.secrets.outputs.run == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          branch="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          neon branches create --project-id "$NEON_PROJECT_ID" --name "$branch" --parent dev \
            --no-compute --no-secrets -o json \
            --expires-at "$(date -u -d '+1 day' +%Y-%m-%dT%H:%M:%SZ)"
          # Cut from `dev`, so the bucket normally came across; create it if not.
          neon buckets list --project-id "$NEON_PROJECT_ID" --branch "$branch" -o json | grep -q '"uploads"' \
            || neon buckets create uploads --project-id "$NEON_PROJECT_ID" --branch "$branch" --access-level public_read >/dev/null
          trap 'rm -f .env.ci-storage' EXIT
          (umask 077 && : > .env.ci-storage)
          neon env pull --project-id "$NEON_PROJECT_ID" --branch "$branch" \
            --file .env.ci-storage -s object-storage
          node scripts/ci-storage.mjs map .env.ci-storage

      # The mutation that proves this step: inject a STORAGE_ value naming the
      # production branch's endpoint and it fails (`scripts/ci-storage.test.mjs`).
      - name: Assert no production storage value is present
        if: steps.secrets.outputs.run == 'true'
        run: node scripts/ci-storage.mjs assert

      # The file `seed:e2e` and `pnpm e2e:auth` read the accounts from. Values
      # come from masked secrets and are written, never echoed.
      - name: Write .env.e2e.local
        if: steps.secrets.outputs.run == 'true'
        run: |
          for name in E2E_CUSTOMER_EMAIL E2E_CUSTOMER_PASSWORD E2E_VENDOR_EMAIL E2E_VENDOR_PASSWORD \
                      E2E_ADMIN_EMAIL E2E_ADMIN_PASSWORD E2E_VENDOR_STRIPE_ACCOUNT_ID STRIPE_SECRET_KEY; do
            printf '%s=%s\n' "$name" "${!name}"
          done > .env.e2e.local
          # Written only when the secret exists, so an absent one is reported by
          # the spec as "not in .env.e2e.local" rather than read as an empty login.
          for name in E2E_NEWCOMER_EMAIL E2E_NEWCOMER_PASSWORD; do
            if [ -n "${!name}" ]; then printf '%s=%s\n' "$name" "${!name}" >> .env.e2e.local; fi
          done

      - name: Build
        if: steps.secrets.outputs.run == 'true'
        run: pnpm build

      # The suite's seeding contract (apps/web/e2e/README.md). `lane:up` runs the
      # same seeds in the same order, and preflight's lane.test.ts fails if the
      # two part ways.
      - name: Migrate and seed
        if: steps.secrets.outputs.run == 'true'
        run: |
          pnpm db:migrate
          pnpm db:seed
          pnpm db:seed:marketing
          pnpm db:seed:e2e

      # `listen` forwards platform and Connect events to the API, and prints the
      # signing secret the API verifies them with — so it runs before the API.
      - name: Forward Stripe webhooks
        if: steps.secrets.outputs.run == 'true'
        env:
          STRIPE_CLI_VERSION: 1.50.11
        run: |
          curl -fsSL "https://github.com/stripe/stripe-cli/releases/download/v${STRIPE_CLI_VERSION}/stripe_${STRIPE_CLI_VERSION}_linux_x86_64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" stripe
          signing=$("$RUNNER_TEMP/stripe" listen --api-key "$STRIPE_SECRET_KEY" --print-secret)
          echo "::add-mask::$signing"
          echo "STRIPE_WEBHOOK_SECRET=$signing" >> "$GITHUB_ENV"
          nohup "$RUNNER_TEMP/stripe" listen --api-key "$STRIPE_SECRET_KEY" \
            --forward-to localhost:4000/webhooks/stripe \
            --forward-connect-to localhost:4000/webhooks/stripe \
            > "$RUNNER_TEMP/stripe-listen.log" 2>&1 &

      # The Resend key is a placeholder with the registry's shape, which the API
      # validates at boot: no journey asserts a delivered email, so the job never
      # needs to reach Resend.
      - name: Start the API and web
        if: steps.secrets.outputs.run == 'true'
        run: |
          read -r RESEND_API_KEY <<< re_ci_placeholder_not_a_key
          export RESEND_API_KEY
          nohup pnpm --filter @vendor-marketplace/api start > "$RUNNER_TEMP/api.log" 2>&1 &
          (cd apps/web && nohup pnpm exec next start --port "$WEB_PORT" > "$RUNNER_TEMP/web.log" 2>&1 &)
          scripts/wait-http.sh --timeout 120 http://localhost:4000/ready http://localhost:3000/ \
            || { tail -n 50 "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/web.log"; exit 1; }

      - name: Sign in the E2E accounts
        if: steps.secrets.outputs.run == 'true'
        run: |
          pnpm --filter @vendor-marketplace/web exec playwright install --with-deps chromium
          pnpm e2e:auth

      # `e2e-auth.mjs` masks the form's inputs; no trace, for the reason below.
      - name: Upload the sign-in diagnostics
        if: failure() && steps.secrets.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sign-in-diagnostics
          path: .auth/diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      - name: Run the journeys
        if: steps.secrets.outputs.run == 'true'
        run: pnpm --filter @vendor-marketplace/web test:e2e

      - name: Report retries and timing
        if: always() && steps.secrets.outputs.run == 'true' && hashFiles('apps/web/playwright-results.json') != ''
        run: node scripts/e2e-ci.mjs summary apps/web/playwright-results.json

      # The repository is public, so an artifact is readable by any GitHub user.
      # Hence no traces (`playwright.config.ts` turns them off on CI — a trace
      # records the E2E accounts' auth session cookies, the admin's included)
      # and no `stripe-listen.log`, which prints the webhook signing secret
      # unmasked. The report keeps each failure's screenshot and error context.
      # `cancelled()` too, so a run that hit `timeout-minutes` still leaves them.
      - name: Upload the Playwright report
        if: (failure() || cancelled()) && steps.secrets.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/playwright-results.json
          retention-days: 14

      # The API redacts cookie, authorization and signature headers from its log.
      - name: Upload the server logs
        if: (failure() || cancelled()) && steps.secrets.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stack-logs
          path: |
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/web.log
          retention-days: 14

      # Always: a run that fails or is cancelled must not strand a branch against
      # the plan's ceiling. Only a `ci-` branch is ever deleted here.
      - name: Delete this run's storage branch
        if: always() && steps.storage.outputs.branch != ''
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          STORAGE_BRANCH: ${{ steps.storage.outputs.branch }}
        run: |
          case "$STORAGE_BRANCH" in ci-*) ;; *) echo "::error::refusing to delete $STORAGE_BRANCH"; exit 1 ;; esac
          neon branches delete "$STORAGE_BRANCH" --project-id "$NEON_PROJECT_ID" \
            || echo "::warning::could not delete $STORAGE_BRANCH; it expires on its own within a day"

# Migrations are not CI's job. `deploy.yml` runs them after this workflow
# succeeds on a push to `staging` or `production`, over DATABASE_URL_UNPOOLED, before either service deploys
# (VEN-397). Before that they ran in Railway's `preDeployCommand`, over the
# runtime's pooled URL; that path was removed with it, so there is one route to
# production DDL. The migrate-staging and migrate-production jobs that once
# lived here were deleted for the same reason; see ticket #204.
