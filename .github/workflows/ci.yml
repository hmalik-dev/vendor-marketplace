name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  # The suites boot an in-process Postgres (PGlite); no service container is
  # needed, but the db package still validates that a URL is configured.
  DATABASE_URL: postgresql://vendor_marketplace:vendor_marketplace_ci@localhost:5432/vendor_marketplace
  # `next build` instantiates ClerkProvider, which refuses to load without a
  # syntactically valid publishable key. These are placeholders, not secrets:
  # CI never reaches Clerk's servers.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2kuY2xlcmsuYWNjb3VudHMuZGV2JA
  CLERK_SECRET_KEY: sk_test_ci_placeholder
  CLERK_WEBHOOK_SECRET: whsec_ci_placeholder
  NEXT_PUBLIC_API_URL: http://localhost:4000

jobs:
  verify:
    name: Typecheck, lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache turbo build outputs
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # First, and on its own: a pre-commit hook can be skipped with
      # `--no-verify`, so the same scan runs here over every tracked file. This
      # is the copy that cannot be bypassed.
      - name: Scan for committed credentials
        run: pnpm secrets:scan:all

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm build

      - run: pnpm test

  # Migrations run from CI, never from a laptop. `resolveMigrationUrl()` prefers
  # DATABASE_URL_UNPOOLED because Neon's pooled endpoint is PgBouncer in
  # transaction mode: it does not pin a session, so the advisory lock the
  # migrator takes and the DDL it issues are not guaranteed to see the same
  # backend.
  #
  # Both jobs depend on `verify`, so a red tree never reaches a database, and
  # both opt out of the workflow's cancel-in-progress: cancelling a migration
  # mid-flight is how you get a half-applied schema.
  migrate-staging:
    name: Migrate staging
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    concurrency:
      group: migrate-staging
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Require the staging connection string
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::DATABASE_URL_UNPOOLED is not set on the staging environment."
            echo "Add it under Settings -> Environments -> staging. See ticket #204."
            exit 1
          fi

      - name: Apply migrations
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: pnpm db:migrate

  # Gated by the `production` GitHub Environment, which carries a required
  # reviewer — the last deliberate step between a merge and real user data.
  migrate-production:
    name: Migrate production
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    concurrency:
      group: migrate-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Require the production connection string
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::DATABASE_URL_UNPOOLED is not set on the production environment."
            echo "Add it under Settings -> Environments -> production. See ticket #204."
            exit 1
          fi

      - name: Apply migrations
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: pnpm db:migrate
