name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  # Most suites boot an in-process Postgres (PGlite) and need no server. The
  # contention suites do — PGlite is one connection, so a row lock there cannot
  # be told apart from its absence — and they run against the service container
  # below, each creating and dropping a database of its own on it. The db
  # package also validates that a URL is configured, which this satisfies.
  DATABASE_URL: postgresql://vendor_marketplace:vendor_marketplace_ci@localhost:5432/vendor_marketplace
  # `next build` instantiates ClerkProvider, which refuses to load without a
  # syntactically valid publishable key. These are placeholders, not secrets:
  # CI never reaches Clerk's servers.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2kuY2xlcmsuYWNjb3VudHMuZGV2JA
  CLERK_SECRET_KEY: sk_test_ci_placeholder
  CLERK_WEBHOOK_SECRET: whsec_ci_placeholder
  NEXT_PUBLIC_API_URL: http://localhost:4000

jobs:
  verify:
    name: Typecheck, lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # The major must track the one Neon runs and the one docker-compose.yml
      # pins; a drift test in `packages/preflight` fails if the three disagree.
      #
      # `trust` rather than a password: the container lives for one job, listens
      # only on the runner's loopback and holds nothing but throwaway test
      # databases, and a password written here would be a credential-shaped
      # literal in version control for no gain. The password half of
      # DATABASE_URL above is simply ignored.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: vendor_marketplace
          POSTGRES_DB: vendor_marketplace
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vendor_marketplace"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache turbo build outputs
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # First, and on its own: a pre-commit hook can be skipped with
      # `--no-verify`, so the same scan runs here over every tracked file. This
      # is the copy that cannot be bypassed.
      - name: Scan for committed credentials
        run: pnpm secrets:scan:all

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm build

      - run: pnpm test

      # Two connections to one database, which PGlite cannot be. Kept out of
      # `pnpm test` so that task stays runnable with nothing but Node; here a
      # server is guaranteed, so failing to reach one is a real failure (#399).
      - run: pnpm test:contention

      # The orchestration machinery under .claude/ (the hunt-bugs workflow, the
      # schema-migration guard) has its own tests. They are plain node scripts,
      # so `turbo run test` — which only fans out across packages — never saw
      # them. Without this step a regression in a hook or a workflow ships green.
      - name: Test agent workflows and hooks
        run: pnpm test:agents

# Migrations are Railway's job, not CI's. `railway.json` carries
# `preDeployCommand`, which runs the compiled migrator before a new container
# takes traffic — atomic with the deploy that needs the schema, and impossible
# to skip. The migrate-staging and migrate-production jobs that used to live
# here were a second path to the same DDL and were deleted; see ticket #204.
