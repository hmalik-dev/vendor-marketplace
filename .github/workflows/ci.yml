name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  # The suites boot an in-process Postgres (PGlite); no service container is
  # needed, but the db package still validates that a URL is configured.
  DATABASE_URL: postgresql://vendor_marketplace:vendor_marketplace_ci@localhost:5432/vendor_marketplace
  # `next build` instantiates ClerkProvider, which refuses to load without a
  # syntactically valid publishable key. These are placeholders, not secrets:
  # CI never reaches Clerk's servers.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2kuY2xlcmsuYWNjb3VudHMuZGV2JA
  CLERK_SECRET_KEY: sk_test_ci_placeholder
  CLERK_WEBHOOK_SECRET: whsec_ci_placeholder
  NEXT_PUBLIC_API_URL: http://localhost:4000

jobs:
  verify:
    name: Typecheck, lint, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Cache turbo build outputs
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # First, and on its own: a pre-commit hook can be skipped with
      # `--no-verify`, so the same scan runs here over every tracked file. This
      # is the copy that cannot be bypassed.
      - name: Scan for committed credentials
        run: pnpm secrets:scan:all

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm build

      - run: pnpm test

      # The orchestration machinery under .claude/ (the hunt-bugs workflow, the
      # schema-migration guard) has its own tests. They are plain node scripts,
      # so `turbo run test` — which only fans out across packages — never saw
      # them. Without this step a regression in a hook or a workflow ships green.
      - name: Test agent workflows and hooks
        run: pnpm test:agents

# Migrations are Railway's job, not CI's. `railway.json` carries
# `preDeployCommand`, which runs the compiled migrator before a new container
# takes traffic — atomic with the deploy that needs the schema, and impossible
# to skip. The migrate-staging and migrate-production jobs that used to live
# here were a second path to the same DDL and were deleted; see ticket #204.
