# Neon: a database branch per pull request
#
# Every PR gets a copy-on-write branch off `staging`, so its migrations run
# against a full-fidelity copy in isolation and the branch is dropped when the
# PR closes. Copy-on-write means this costs no storage until the PR writes.
#
# The branch carries the uploads bucket too (Neon copies buckets with the
# branch), so the PR's storage is its own and never `production`'s: the
# branch's STORAGE_* values reach the later steps through the job environment,
# masked, and a step fails the job if any of them names production (VEN-457).
#
# Inert until NEON_API_KEY and the NEON_PREVIEW_BRANCHES variable exist — see
# ticket #205.
#
# The two Neon actions are pinned to commit SHAs rather than moving tags: both
# receive NEON_API_KEY, so a retagged release would hand a project-wide
# credential to whatever the new tag points at.
name: Neon preview branch

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

# Least privilege (VEN-675): the workflow grants nothing; each job asks for what
# it uses. Nothing calls the GitHub API with the token beyond checking out.
permissions: {}

concurrency:
  group: neon-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  NEON_PROJECT_ID: dark-surf-79137727
  NEON_PARENT_BRANCH: staging

jobs:
  create:
    name: Create or update the branch
    if: github.event.action != 'closed' && vars.NEON_PREVIEW_BRANCHES == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      # Belt and braces against the free plan's 10-branch ceiling: the delete
      # job below is the normal path, but a workflow that never runs — a PR
      # closed while Actions were disabled, say — would otherwise strand a
      # branch forever.
      - name: Compute a branch expiry
        id: expiry
        run: echo "at=$(date -u -d '+7 days' +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Create the Neon branch
        id: branch
        uses: neondatabase/create-branch-action@72ed4f69a12b6be9c16aebfad893f6a21e9aba8b # v6.4.0
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          parent_branch: ${{ env.NEON_PARENT_BRANCH }}
          branch_name: preview/pr-${{ github.event.pull_request.number }}
          expires_at: ${{ steps.expiry.outputs.at }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `migrate.ts` imports @vendor-marketplace/shared, which resolves to its
      # `dist`. Without this the run dies on ERR_MODULE_NOT_FOUND before it
      # reaches the database.
      - run: pnpm build --filter=@vendor-marketplace/db...

      # The bucket comes with the branch; create it (public_read, as neon.ts
      # declares) only if `staging` had none. Not `neon deploy`: the pinned CLI
      # rejects neon.ts's `buckets` key. The pull file is created owner-only
      # first, because the CLI keeps an existing file's mode.
      # Its own step, with no credential in scope and no install scripts.
      - name: Install the Neon CLI
        run: npm install --global --ignore-scripts neonctl@4.11.0

      - name: Read the branch's storage credential
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PREVIEW_BRANCH: preview/pr-${{ github.event.pull_request.number }}
        run: |
          neon buckets list --project-id "$NEON_PROJECT_ID" --branch "$PREVIEW_BRANCH" -o json | grep -q '"uploads"' \
            || neon buckets create uploads --project-id "$NEON_PROJECT_ID" --branch "$PREVIEW_BRANCH" --access-level public_read >/dev/null
          trap 'rm -f .env.preview-storage' EXIT
          (umask 077 && : > .env.preview-storage)
          neon env pull --project-id "$NEON_PROJECT_ID" --branch "$PREVIEW_BRANCH" \
            --file .env.preview-storage -s object-storage
          node scripts/ci-storage.mjs map .env.preview-storage

      # Mutation-tested in `scripts/ci-storage.test.mjs`: a STORAGE_ value naming
      # the production branch's endpoint fails this step.
      - name: Assert no production storage value is present
        run: node scripts/ci-storage.mjs assert

      # The point of the branch: prove this PR's migrations apply cleanly to a
      # copy of staging before they are ever pointed at staging itself.
      - name: Apply this PR's migrations to the branch
        env:
          DATABASE_URL_UNPOOLED: ${{ steps.branch.outputs.db_url }}
        run: pnpm db:migrate

  delete:
    name: Delete the branch
    if: github.event.action == 'closed' && vars.NEON_PREVIEW_BRANCHES == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}

    steps:
      - name: Delete the Neon branch
        uses: neondatabase/delete-branch-action@4468d825d5a88ef4012f1705a82f02ec3072f776 # v3.2.1
        with:
          project_id: ${{ env.NEON_PROJECT_ID }}
          branch: preview/pr-${{ github.event.pull_request.number }}
          api_key: ${{ secrets.NEON_API_KEY }}
